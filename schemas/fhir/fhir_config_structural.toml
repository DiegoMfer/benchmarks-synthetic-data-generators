# rudof generate -- configuration for the FHIR structural-conformance experiment
# =============================================================================
# PURPOSE
# This config produces the rudof FHIR-RDF dataset at a Synthea-comparable scale
# for the Part-2 FHIR pipeline (run_fhir.sh -> fhir_scale_comparison.py). It is
# paired with the schema fhir_r4_tuned.shex.
#
# DESIGN RATIONALE (why these values, for these metrics)
#  * entity_count = 60000  -> yields ~2.2M triples / ~9.7k resources, the same
#    order of magnitude as the Synthea reference dataset, so the structural
#    footprint metrics (triples, nodes, ratios) are compared at a comparable
#    scale. 60k is also the largest budget that fits in memory on the benchmark
#    host (140k was OOM-killed).
#  * cardinality_strategy = "Maximum", property_fill_probability = 1.0,
#    property_selection_strategy = "All"  -> every optional element of every
#    shape is materialized, so the dataset exercises the FULL breadth of the
#    FHIR R4 schema (all ~145 resource types). This maximizes the structural
#    surface the conformance triage inspects (typing arcs, primitive wrapping,
#    nesting), rather than under-reporting it.
#  * the tuned datatype generators below ensure rudof emits real primitive
#    literals, so the "malformed primitive" check (is a primitive wrapped in a
#    fhir:value node, or hung directly on the property?) is meaningful rather
#    than vacuous.
#
# NOTE: the structural-conformance results (canonical resource typing, primitive
# wrapping, blank-node nesting) are a property of how rudof *serializes* RDF and
# are independent of these parameters; the parameters only set the scale and the
# schema breadth at which that serialization is observed.
# =============================================================================

[generation]
entity_count = 60000
seed = 42
entity_distribution = "Equal"
cardinality_strategy = "Maximum"
schema_format = "ShEx"

# Populate every optional property on every instance (full schema coverage).
property_fill_probability = 1.0
ignore_min_cardinality = false
max_properties_per_instance = 0
property_selection_strategy = "All"
property_count_variance = 0.0

[field_generators.default]
locale = "en"
quality = "High"

# ============================================================================
# DATATYPE-SPECIFIC GENERATORS  (fire on every fhir:value leaf)
# ============================================================================
[field_generators.datatypes."http://www.w3.org/2001/XMLSchema#string"]
generator = "string"
parameters = {}

[field_generators.datatypes."http://www.w3.org/2001/XMLSchema#integer"]
generator = "integer"
[field_generators.datatypes."http://www.w3.org/2001/XMLSchema#integer".parameters]
min = 0
max = 1000

[field_generators.datatypes."http://www.w3.org/2001/XMLSchema#decimal"]
generator = "decimal"
[field_generators.datatypes."http://www.w3.org/2001/XMLSchema#decimal".parameters]
min = 0.0
max = 500.0
precision = 2

[field_generators.datatypes."http://www.w3.org/2001/XMLSchema#boolean"]
generator = "boolean"
parameters = {}

# Dates kept inside a clinically plausible window (well within 1900..now+1).
[field_generators.datatypes."http://www.w3.org/2001/XMLSchema#date"]
generator = "date"
[field_generators.datatypes."http://www.w3.org/2001/XMLSchema#date".parameters]
start_year = 1940
end_year = 2026

[field_generators.datatypes."http://www.w3.org/2001/XMLSchema#dateTime"]
generator = "datetime"
[field_generators.datatypes."http://www.w3.org/2001/XMLSchema#dateTime".parameters]
start_year = 2010
end_year = 2026
include_time = true

# xsd:time -> HH:MM:SS
[field_generators.datatypes."http://www.w3.org/2001/XMLSchema#time"]
generator = "pattern"
[field_generators.datatypes."http://www.w3.org/2001/XMLSchema#time".parameters]
regex = "(0[0-9]|1[0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]"

# xsd:anyURI -> generic URI (used by uri/url/canonical primitives)
[field_generators.datatypes."http://www.w3.org/2001/XMLSchema#anyURI"]
generator = "uri"
parameters = {}

# ============================================================================
# OUTPUT
# ============================================================================
[output]
path = "fhir_generated.ttl"
format = "Turtle"
compress = false
write_stats = true
parallel_writing = false
parallel_file_count = 0

[parallel]
worker_threads = 4
batch_size = 100
parallel_shapes = true
parallel_fields = true
