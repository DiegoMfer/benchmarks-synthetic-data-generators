[output]
format = "Turtle"
path = "output/generated_data.ttl"
compress = false
write_stats = true
parallel_writing = false
parallel_file_count = 1

[parallel]
threads = 8
batch_size = 100
parallel_shapes = true
parallel_fields = true

[generation]
entity_count = 10000
seed = 42
cardinality_strategy = "Balanced"

# Low coherence: balanced cardinality with random property selection
# Random selection means some entities skip some properties
# This creates sparsity while keeping same predicate union as high coherence
property_fill_probability = 0.6
ignore_min_cardinality = true
max_properties_per_instance = 0
property_selection_strategy = "Random"
property_count_variance = 0.0

entity_distribution = "Equal"

[field_generators.default]
locale = "en"
quality = "Low"

[field_generators.datatypes."http://www.w3.org/2001/XMLSchema#integer"]
generator = "integer"
[field_generators.datatypes."http://www.w3.org/2001/XMLSchema#integer".parameters]
min = 1
max = 1000

[field_generators.datatypes."http://www.w3.org/2001/XMLSchema#string"]
generator = "string"
parameters = {}
