[output]
format = "Turtle"
path = "output/generated_data.ttl"
compress = false
write_stats = true
parallel_writing = false
parallel_file_count = 1

[parallel]
threads = 8
batch_size = 100
parallel_shapes = true
parallel_fields = true

[generation]
entity_count = 10000
seed = 42
cardinality_strategy = "Minimum"

property_fill_probability = 0.03
ignore_min_cardinality = false
max_properties_per_instance = 1
property_selection_strategy = "Random"
property_count_variance = 0.95

entity_distribution = "Equal"

excluded_properties = [
    "http://www.lehigh.edu/~zhp2/2004/0401/univ-bench.owl#advisor",
    "http://www.lehigh.edu/~zhp2/2004/0401/univ-bench.owl#teacherOf",
    "http://www.lehigh.edu/~zhp2/2004/0401/univ-bench.owl#teaches",
    "http://www.lehigh.edu/~zhp2/2004/0401/univ-bench.owl#takesCourse"
]

[generation.type_overrides."http://weso.es/shapes/GraduateStudent"]
property_fill_probability = 0.02
max_properties_per_instance = 1
property_selection_strategy = "Random"

[generation.type_overrides."http://weso.es/shapes/UndergraduateStudent"]
property_fill_probability = 0.02
max_properties_per_instance = 1
property_selection_strategy = "Random"

[generation.type_overrides."http://weso.es/shapes/ResearchAssistant"]
property_fill_probability = 0.02
max_properties_per_instance = 1
property_selection_strategy = "Random"

[generation.type_overrides."http://weso.es/shapes/TeachingAssistant"]
property_fill_probability = 0.02
max_properties_per_instance = 1
property_selection_strategy = "Random"

[generation.type_overrides."http://weso.es/shapes/Lecturer"]
property_fill_probability = 0.05
max_properties_per_instance = 1
property_selection_strategy = "Random"

[generation.type_overrides."http://weso.es/shapes/AssistantProfessor"]
property_fill_probability = 0.05
max_properties_per_instance = 1
property_selection_strategy = "Random"

[generation.type_overrides."http://weso.es/shapes/AssociateProfessor"]
property_fill_probability = 0.05
max_properties_per_instance = 1
property_selection_strategy = "Random"

[generation.type_overrides."http://weso.es/shapes/FullProfessor"]
property_fill_probability = 0.05
max_properties_per_instance = 1
property_selection_strategy = "Random"

[field_generators.default]
locale = "en"
quality = "Low"

[field_generators.datatypes."http://www.w3.org/2001/XMLSchema#integer"]
generator = "integer"
[field_generators.datatypes."http://www.w3.org/2001/XMLSchema#integer".parameters]
min = 1
max = 1000

[field_generators.datatypes."http://www.w3.org/2001/XMLSchema#string"]
generator = "string"
parameters = {}
