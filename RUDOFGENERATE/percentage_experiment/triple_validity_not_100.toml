# Triple-validity case with errors
# Intended outcome: less than 100% triple validity on the same shape.
# The same config can be used with either a ShEx schema or an equivalent SHACL schema.

[generation]
entity_count = 100000
seed = 42
cardinality_strategy = "Minimum"
property_fill_probability = 0.35
ignore_min_cardinality = true
max_properties_per_instance = 6
property_selection_strategy = "Random"
property_count_variance = 0.7
entity_distribution = "Equal"

[field_generators.default]
locale = "en"
quality = "Low"

[field_generators.datatypes."http://www.w3.org/2001/XMLSchema#integer"]
generator = "integer"
[field_generators.datatypes."http://www.w3.org/2001/XMLSchema#integer".parameters]
min = 1
max = 1000

[field_generators.datatypes."http://www.w3.org/2001/XMLSchema#string"]
generator = "string"
parameters = {}

[output]
format = "Turtle"
path = "target/percentage_experiment/triple_validity_not_100.ttl"
compress = false
write_stats = true
parallel_writing = false
parallel_file_count = 1

[parallel]
worker_threads = 8
batch_size = 100
parallel_shapes = true
parallel_fields = true
