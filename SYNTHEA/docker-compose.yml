version: '3.8'

services:
  synthea:
    build: .
    container_name: synthea-fhir-benchmark
    volumes:
      - ./output:/app/output
    environment:
      - PYTHONUNBUFFERED=1
      - POPULATION=${POPULATION:-20}
      - SEED=${SEED:-42}
    command: ["--population", "${POPULATION:-20}", "--seed", "${SEED:-42}", "--output-dir", "output", "--output-format", "turtle"]
